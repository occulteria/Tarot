<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Occulteria. Тренажёры по картам</title>
<style>
:root{--lt:#F3EDE5;--dk:#161616;--ac:#DF481A;--ac2:#C9BFB4;--ok:#2f7d4f;--bad:#b3261e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--lt);color:var(--dk);font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1,h2,.bb{font-family:Oswald,'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0}
h1{font-size:40px;line-height:1}
.kick{font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:12px;letter-spacing:.2em;color:var(--ac);text-transform:uppercase}
.bar{width:60px;height:4px;background:var(--ac);margin:12px 0 16px}
.lead{font-size:16px;color:#333;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.tile{border:1.5px solid var(--dk);background:#fff8;padding:14px 14px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;border-radius:3px;position:relative}
.tile:hover,.tile:focus{background:#fff;outline:none;box-shadow:4px 4px 0 var(--ac)}
.tile b{display:block;font-family:Oswald,'Arial Narrow',Impact,sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.tile span{display:block;font-size:14.5px;color:#444;margin-top:3px}
.tile i{position:static;display:block;margin-top:6px;font-style:normal;font-family:Oswald,sans-serif;font-size:12px;color:var(--ac);letter-spacing:.08em}
.sec{margin:26px 0 10px}
.sec h2{font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.btn{font-family:Oswald,'Arial Narrow',Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:15px;border:1.5px solid var(--dk);background:var(--dk);color:var(--lt);padding:11px 18px;cursor:pointer;border-radius:2px}
.btn.alt{background:transparent;color:var(--dk)}
.btn.ac{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.prog{height:6px;background:var(--ac2);margin:8px 0 18px}
.prog div{height:100%;background:var(--ac);width:0}
.q{font-size:19px;margin:8px 0 14px}
.qc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.cw{display:inline-block;width:84px}
.cw.s{width:62px}.cw.l{width:104px}
.cw svg{width:100%;height:auto;display:block;filter:drop-shadow(1px 2px 2px #0003)}
.cap{text-align:center;font-family:Oswald,'Arial Narrow',sans-serif;font-size:14px;letter-spacing:.05em;margin-top:2px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:17px;border:1.5px solid var(--dk);background:#fff9;padding:12px 14px;cursor:pointer;border-radius:3px;color:inherit}
.opt:hover:not(:disabled){background:#fff}
.opt.ok{background:#dff1e5;border-color:var(--ok)}
.opt.bad{background:#f7dcd9;border-color:var(--bad)}
.opt:disabled{cursor:default}
.opts.cd2{grid-template-columns:repeat(2,1fr)}
.opts.cd2 .opt{display:flex;gap:6px;justify-content:center;align-items:center;padding:10px 6px}
.opts.cd2.t3 .cw{width:56px}
.exp{margin-top:16px;border-left:4px solid var(--ac);background:#fff;padding:12px 14px;font-size:16px}
.exp p{margin:0 0 7px}.exp .lb{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.res{text-align:center;padding:10px 0}
.res .big{font-family:Oswald,sans-serif;font-size:72px;line-height:1;color:var(--ac)}
.miss{border:1px solid var(--ac2);background:#fff8;padding:10px 12px;margin:8px 0;font-size:15.5px}
.tag{display:inline-block;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--dk);padding:1px 7px;margin-right:6px}
.back{background:none;border:0;font:inherit;color:var(--ac);cursor:pointer;padding:0;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.note{font-size:14px;color:#555;margin-top:6px}
.tab{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab button{font:inherit;font-size:15px;padding:6px 12px;border:1.5px solid var(--dk);background:transparent;cursor:pointer;border-radius:2px}
.tab button.on{background:var(--dk);color:var(--lt)}
.mg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.mini{border:0;padding:0;background:none;cursor:pointer}.mini svg{width:100%;height:auto;display:block;filter:drop-shadow(1px 1px 1px #0003)}
.mini.dd{opacity:.25}
.cw.xs{width:38px}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px 56px}.pm>div{display:grid;gap:8px;align-content:start}
.pc{display:flex;gap:2px;justify-content:center;align-items:center;min-height:66px;border:1.5px solid var(--dk);background:#fff9;padding:6px;font:inherit;font-size:15px;color:inherit;cursor:pointer;border-radius:3px;text-align:center}
.pc.sl{background:#ffe6dc;border-color:var(--ac)}.pc.dn{background:#dff1e5;border-color:var(--ok);opacity:.6}.pc.wr{background:#f7dcd9;border-color:var(--bad)}
.vol{border:1.5px solid var(--dk);background:#fff8;margin:10px 0;border-radius:3px}.vol summary{padding:12px 14px;font-size:20px;cursor:pointer}.lrow{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;font-size:16px;background:none;border:0;border-top:1px solid var(--ac2);padding:11px 14px;cursor:pointer;color:inherit}.lrow:hover{background:#fff}.lrow i{font-style:normal;font-family:Oswald,sans-serif;font-size:12px;color:var(--ok);white-space:nowrap}
.panel{border:1.5px solid var(--dk);background:#fff8;padding:10px 12px;margin-bottom:6px;border-radius:3px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mt{min-height:96px;border:1.5px solid var(--dk);background:repeating-linear-gradient(45deg,var(--dk),var(--dk) 6px,#2a2a2a 6px,#2a2a2a 12px);cursor:pointer;border-radius:3px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px;padding:3px;font:inherit;font-size:12.5px;color:var(--dk);line-height:1.15}.mt.f{background:#fffd}.mt.dn{background:#dff1e5;border-color:var(--ok)}.mt .cw.s{width:44px}
.deckb{width:84px;height:118px;border:2px solid var(--ac);border-radius:6px;background:repeating-linear-gradient(45deg,var(--dk),var(--dk) 7px,#2a2a2a 7px,#2a2a2a 14px);color:var(--lt);font-family:Oswald,sans-serif;font-size:24px;cursor:pointer}
.ans{font-family:Oswald,sans-serif;font-size:34px;letter-spacing:.12em;text-align:center;min-height:48px;margin:6px 0 10px}.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.lt{width:44px;height:48px;font-family:Oswald,sans-serif;font-size:22px;border:1.5px solid var(--dk);background:#fffc;cursor:pointer;border-radius:3px}.lt:disabled{opacity:.25}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}.sc{aspect-ratio:3/4;border:1.5px dashed var(--ac2);background:#fff6;cursor:pointer;font-family:Oswald,sans-serif;font-size:20px;color:#fff;border-radius:3px}.sc.on{background:var(--ac);border:1.5px solid var(--ac)}
.sg2{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}.scc{text-align:center}.scc .cw{width:100%}
.pmw{position:relative}.ln{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}.slot{display:inline-flex;align-items:center;justify-content:center;width:84px;height:118px;border:2px dashed var(--ac);font-family:Oswald,sans-serif;font-size:40px;color:var(--ac);border-radius:6px;background:#fff6}.slot.f{border-style:solid;background:none;padding:0}.slot.f svg{width:100%;height:auto}
.ta{width:100%;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--dk);background:#fffc;border-radius:3px;margin:8px 0}
details.miss summary{cursor:pointer;list-style:none}.rw{display:inline-flex;vertical-align:middle;gap:2px}
</style></head><body><div class="wrap" id="app"></div>

, "Туз": "главное событие, основа"}, "suit": {"Черви": "чувства, любовь, семья, дом", "Бубны": "деньги, документы, вести, сделки", "Трефы": "дела, работа, обязательства, власть", "Пики": "трудности, ссоры, потери, уход"}, "dups": [{"t": "Признание", "c": ["9♥", "8♥"], "say": "Девятка червей: любовь. Восьмёрка червей: разговор по душам.", "tog": "Человек скажет о своих чувствах или уже говорит о них. Идёт откровенный разговор, в котором звучит любовь.", "sw": "8♥ и 9♥: сначала долгие разговоры, потом из них вырастает чувство. Так начинаются романы, которые рождаются из общения.", "ex": "Вопрос: «Скажет ли он, что любит?» Ответ: Скажет: будет открытый разговор, в котором прозвучит признание."}, {"t": "Начало влюблённости", "c": ["6♥", "9♥"], "say": "Шестёрка червей: шаг навстречу. Девятка червей: сильное чувство.", "tog": "Человек сделал шаг, и за ним последовало настоящее чувство. Так начинается любовь: сначала знакомство, потом тяга.", "sw": "9♥ и 6♥: чувство уже есть, и вот приходит весточка или встреча, которая его подтверждает.", "ex": "Вопрос: «Начнётся ли у нас роман?» Ответ: Да, за первым шагом придёт настоящее чувство."}, {"t": "Любовь и ревность", "c": ["9♥", "7♠"], "say": "Девятка червей: любовь. Семёрка пик: ссора, подозрения.", "tog": "Из-за сильного чувства возникает ссора. Человек ревнует, подозревает, обижается именно потому, что ему дорог другой.", "sw": "7♠ и 9♥: сначала ссора, и после неё чувства разгораются снова. Бывает, что размолвка показывает людям, как они нужны друг другу.", "ex": "Вопрос: «Почему мы так часто ссоримся?» Ответ: Причина в ревности, которая растёт из сильного чувства."}, {"t": "Любовь и расставание", "c": ["9♥", "6♠"], "say": "Девятка червей: любовь. Шестёрка пик: уход, отдаление.", "tog": "Чувство есть, но человек отдаляется или уезжает. Любовь не победила обстоятельства: расстояние, нехватка времени, чужая воля.", "sw": "6♠ и 9♥: человек уехал, и именно на расстоянии чувство стало сильным. Хороший знак для отношений на рассто  что он ей отвечает. Это показывает, что она рядом.", "sw": "К♥ и Д♠: мужчина сам входит в сложные отношения с этой женщиной.", "ex": "Вопрос: «Есть ли у него другая?» Ответ: Рядом с ним есть женщина, настроенная против вас, но это ещё не измена."}, {"t": "Давление жёсткого мужчины", "c": ["8♠", "К♠"], "say": "Восьмёрка пик: давящий разговор. Король пик: жёсткий мужчина.", "tog": "Человек находится под давлением сурового, строгого мужчины. Это начальник, отец, муж или противник.", "sw": "К♠ и 8♠: этот мужчина сам начинает тяжёлый разговор или ставит условия.", "ex": "Вопрос: «Почему на меня давит начальник?» Ответ: Это жёсткий мужчина, который ставит условия."}, {"t": "Договор подписан", "c": ["8♦", "Т♦"], "say": "Восьмёрка бубен: документы, согласование. Туз бубен: главная бумага, сделка.", "tog": "Условия согласованы, и документ подписывается. Дело завершается официально.", "sw": "Т♦ и 8♦: договор уже есть, и теперь по нему идёт переписка, согласуются детали.", "ex": "Вопрос: «Подпишут ли договор?» Ответ: Да, условия согласованы, и бумага будет подписана."}, {"t": "Трудные переговоры", "c": ["8♦", "8♠"], "say": "Восьмёрка бубен: бумаги и условия. Восьмёрка пик: тяжёлый разговор.", "tog": "Переговоры по документам идут трудно. Стороны не могут договориться, условия жёсткие, возможен отказ.", "sw": "8♠ и 8♦: сначала тяжёлый разговор, потом всё-таки согласование условий.", "ex": "Вопрос: «Почему не получается договориться по бумагам?» Ответ: Переговоры идут тяжело, и стороны упираются."}, {"t": "Бумаги для учреждения", "c": ["Т♣", "8♦"], "say": "Туз треф: учреждение. Восьмёрка бубен: документы.", "tog": "Нужно подать или получить документы в учреждении. Идёт переписка с официальной организацией.", "sw": "8♦ и Т♣: документы подготовлены и направляются в учреждение.", "ex": "Вопрос: «Что с заявлением в учреждение?» Ответ: Бумаги идут в инстанцию, ждите ответа."}, {"t": "Тяжба", "c": ["Т♣", "7♣"], "say": "Туз треф: официальное дело. Семёрка треф: спор, соперничество.", const DA = { cards: D.cards, dups: D.dups, tris: D.tris, diag: D.diag, spr: D.spr };
let CURLESSON = null, EXAMX = null;
const VT = { 2: 'Том II. Значения карт', 3: 'Том III. Сочетания: дуплеты и триплеты', 4: 'Том IV. Расклады', 5: 'Том V. Магическая диагностика', 6: 'Том VI. Глубинная диагностика' };
function resetScope() { D.cards = DA.cards; D.dups = DA.dups; D.tris = DA.tris; D.diag = DA.diag; D.spr = DA.spr; EXAMX = null; }
function applyScope(sc) {
  resetScope();

  if (sc.rk) D.cards = DA.cards.filter(c => sc.rk.includes(c.r));
  if (sc.tg) D.tris = DA.tris.filter(x => x.g === sc.tg);
  if (sc.dg) D.diag = DA.diag.filter(x => x.g === sc.dg);
  if (sc.sc) { let s = DA.spr.filter(x => sc.sc.includes(x.ch)); if (s.length < 6) s = s.concat(pick(DA.spr.filter(x => !s.includes(x)), 6 - s.length)); D.spr = s; }
}
